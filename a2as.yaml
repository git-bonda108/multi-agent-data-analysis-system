    params:
      returns: Optional[pd.DataFrame]
  feature_importance:
    type: tool
    module: data-insights
    args: [target_column]
    params:
      returns: str
  feature_relationships:
    type: tool
    module: data-insights
    params:
      returns: str
  filter_data:
    type: tool
    module: data-insights
    args: [column, condition, value]
    params:
      returns: str
  format_as_table:
    type: tool
