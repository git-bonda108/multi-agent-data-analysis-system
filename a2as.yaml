    params:
      returns: str
  execute_sql_like_query:
    type: sync
    module: tools.advanced_data_tools
    args: [dataframe, select_columns, where_conditions, group_by, order_by, order_direction, limit]
    params:
      returns: pd.DataFrame
  execute_sql_query:
    type: tool
