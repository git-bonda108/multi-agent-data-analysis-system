  advanced_group_by:
    type: tool
    module: data-insights
    args: [group_by, aggregations]
    params:
      returns: str
  analyze_correlations:
    type: tool
    module: data-insights
    args: [method]
    params:
      returns: str
  calculate_statistics:
    type: tool
    module: data-insights
    params:
      returns: str
  complex_query:
    type: sync
    module: tools.advanced_data_tools
    args: [dataframe, query]
    params:
      returns: pd.DataFrame
  create_agents:
    type: sync
    module: data-insights
    args: [dataframe, model_name]
  create_bar_chart:
    type: tool
    module: data-insights
    args: [column, top_n]
    params:
      returns: str
  create_box_plot:
    type: tool
    module: data-insights
    args: [column]
    params:
      returns: str
  create_correlation_heatmap:
    type: tool
    module: data-insights
    params:
      returns: str
  create_histogram:
    type: tool
    module: data-insights
    args: [column, bins]
    params:
      returns: str
  create_line_plot:
    type: tool
    module: data-insights
    args: [x_column, y_column]
    params:
      returns: str
  create_pair_plot:
    type: tool
    module: data-insights
    args: [columns]
    params:
      returns: str
  create_scatter:
    type: tool
    module: data-insights
    args: [x_column, y_column]
    params:
      returns: str
  create_summary_table:
    type: tool
    module: data-insights
    params:
      returns: str
  detect_outliers:
