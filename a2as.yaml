    module: data-insights
  multi_condition_filter:
    type: sync
    module: tools.advanced_data_tools
    args: [dataframe, conditions, logic]
    params:
      returns: pd.DataFrame
  multi_filter:
    type: tool
    module: data-insights
    args: [conditions, logic]
    params:
      returns: str
  order_by:
    type: tool
    module: data-insights
    args: [column, direction]
    params:
      returns: str
  parse_natural_language_query:
    type: sync
    module: tools.advanced_data_tools
    args: [query, dataframe]
